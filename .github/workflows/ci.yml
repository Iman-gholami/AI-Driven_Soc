name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            panel-ui/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint:backend

      - name: Check formatting
        run: npm run format:check

      - name: Run backend tests
        run: npm test

      - name: Install panel dependencies
        run: npm --prefix panel-ui ci --no-audit --no-fund

      - name: Lint panel
        run: npm run lint:panel

      - name: Build panel
        run: npm --prefix panel-ui run build

  mongodb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_VERSION: 7.0.14
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.14

      - name: Install backend dependencies
        run: npm ci

      - name: Run MongoDB transaction integration tests
        run: npm run test:integration
