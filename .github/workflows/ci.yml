name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            panel-ui/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Install panel dependencies
        run: npm --prefix panel-ui ci --no-audit --no-fund

      - name: Lint panel
        run: npm --prefix panel-ui run lint

      - name: Build panel
        run: npm --prefix panel-ui run build
